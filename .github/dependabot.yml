version: 2

updates:
  - package-ecosystem: composer
    directories:
      - "/"
      - "/tools/php-cs-fixer"
      - "/tools/phpstan"
      - "/tools/twig-cs-fixer"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      composer-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directories:
      - "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - "/infrastructure/docker/services/php"
      - "/infrastructure/docker/services/router"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      docker-dependencies:
        patterns:
          - "*"
