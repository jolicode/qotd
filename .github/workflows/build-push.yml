name: Build and push production images

"on":
  push:
    branches: ["main"]
    tags: ["*"]

permissions:
  contents: read
  packages: write

env:
  # Fix for symfony/color detection. We know GitHub Actions can handle it
  ANSICON: 1
  CASTOR_CONTEXT: prod
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  build-push:
    name: Build and push production images
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - uses: actions/checkout@v7

      - name: setup-castor
        uses: castor-php/setup-castor@v1.1.0

      # Images are tagged with the short commit sha (what a deployment should
      # reference), "latest" on main, and the git tag when there is one
      - name: "Build and push the production images"
        run: >-
          castor docker:push
          --tag="${GITHUB_SHA::7}"
          ${{ github.ref_name == 'main' && '--tag=latest' || '' }}
          ${{ github.ref_type == 'tag' && format('--tag={0}', github.ref_name) || '' }}
