[global]
error_log  = /proc/self/fd/2
daemonize  = no

[www]
listen = 0.0.0.0:9000
pm = dynamic
pm.max_children = 25
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 3
pm.max_requests = 500
pm.status_path = /status
ping.path = /ping
clear_env  = no
request_terminate_timeout = 120s
catch_workers_output = yes
decorate_workers_output = no
