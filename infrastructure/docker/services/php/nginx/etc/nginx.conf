pid       /tmp/nginx.pid;
daemon    off;
error_log /proc/self/fd/2;

include /etc/nginx/modules-enabled/*.conf;

http {
    access_log /proc/self/fd/1;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 20m;
    server_tokens off;

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    client_body_temp_path /tmp/nginx-client_body_temp_path;
    fastcgi_temp_path /tmp/nginx-fastcgi_temp_path;
    proxy_temp_path /tmp/nginx-proxy_temp_path;
    scgi_temp_path /tmp/nginx-scgi_temp_path;
    uwsgi_temp_path /tmp/nginx-uwsgi_temp_path;

    server {
        listen 0.0.0.0:8080;
        root /var/www/public;

        # Assets are baked into the image and fingerprinted by the asset
        # mapper, so they can be cached aggressively
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff2?)$ {
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Used by the nginx image HEALTHCHECK (proxies the php-fpm ping)
        location = /ping {
            access_log off;
            include fastcgi_params;
            fastcgi_pass php-fpm:9000;
            fastcgi_param SCRIPT_NAME /ping;
            fastcgi_param SCRIPT_FILENAME /ping;
        }

        location / {
            # try to serve file directly, fallback to index.php
            try_files $uri /index.php$is_args$args;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass php-fpm:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;

            include fastcgi_params;
            # Environment variables of the php-fpm container are passed
            # through (clear_env = no), no need to define them here

            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS on;
            fastcgi_param SERVER_NAME $http_host;
        }

        error_log  /proc/self/fd/2;
        access_log /proc/self/fd/1;
    }
}

events {}
