# Site configuration, shared by the dev "frontend" container and the production "nginx"
# image. PHP requests are forwarded to php-fpm through the shared unix socket. On
# Kubernetes, the "symfony-app" chart can replace this file with its own ConfigMap.
server {
    listen 8080;
    server_name _;
    root /var/www/public;

    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Fingerprinted by the asset mapper, so they can be cached forever. Served from the
    # disk once compiled (production), by the asset mapper dev server otherwise
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri /index.php$is_args$args;
    }

    # php-fpm ping, used by the images HEALTHCHECK
    location = /ping {
        access_log off;
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_NAME /ping;
        fastcgi_param SCRIPT_FILENAME /ping;
    }

    location / {
        # try to serve file directly, fallback to index.php
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        # TLS is always terminated upstream (dev router, ingress, reverse proxy)
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_NAME $http_host;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
