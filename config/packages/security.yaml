security:
    providers:
        oauth:
            id: knpu.oauth2.user_provider

    firewalls:
        dev:
            pattern: ^/(_profiler|_ux|_wdt|assets|build)/
            security: false
        api:
            pattern: ^/api
            security: false
        command_qotd:
            pattern: ^/command/qotd$
            security: false
        auth:
            pattern: ^/connect/google$
            security: false
        main:
            custom_authenticators:
                # Replaced by App\Security\YoloAuthenticator in the "dev" environment
                - App\Security\GoogleAuthenticator

    access_control:
        - { path: ^/, roles: ROLE_USER }
